name: Build and Release Mamet AI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/package.json' # Hanya build kalau ada perubahan versi di package.json
  workflow_dispatch: # Memungkinkan Anda menekan tombol "Run workflow" secara manual di GitHub

jobs:
  build:
    runs-on: windows-latest # Kita gunakan environment Windows karena Anda nge-build .exe

    permissions:
      contents: write # Wajib agar robot GitHub diizinkan membuat Release baru

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Node 24 (2026-10-27): Node 20 sudah habis dukungan dan TIDAK akan menerima tambalan CVE-2026-111497 (Brotli,
      # "Black October"); 24 juga versi laptop Owner. check-latest: tanpanya setup-node boleh memakai Node 24 yang
      # tersimpan di runner — bisa lebih tua dari 24.22.1 yang tertambal.
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./frontend
        run: npm ci

      # Item 129 (rilis 4.3.0): pemasang membawa Python + Ecosystem Crawler (npm run crawler:siapkan menyalinnya dari
      # .venv crawler). .venv tidak di-commit (repo publik), jadi dibangun di sini dari daftar TERKUNCI — versi Python dan
      # 86 paket persis sama dengan .venv yang sudah diuji di laptop Owner (--no-deps: tak ada paket yang diselesaikan ulang).
      # --require-hashes (T20, 2026-10-28): berkas yang isinya beda dari hash di daftar ditolak — versi palsu/tertukar
      # di indeks tidak bisa lolos walau nomor versinya sama. Daftar ditulis scripts/kunci_bundel.py, bukan tangan.
      - name: 🐍 Setup Python (crawler terbundel)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: 🕷️ Siapkan .venv crawler dari daftar terkunci
        working-directory: ./capability/ecosystem-crawler
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --no-deps --require-hashes --disable-pip-version-check --no-input -r requirements-bundel.txt

      - name: ⚙️ Inject Environment Variables
        working-directory: ./frontend
        run: |
          echo "VITE_SUPABASE_URL=https://uuyzdjifhdfyyvpxsofu.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1eXpkamlmaGRmeXl2cHhzb2Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjMyODUsImV4cCI6MjA5NTIzOTI4NX0.atDqwfpg_uwFI0nZuKQNxebCYh1KC7tdkSooC52m4YQ" >> .env

      - name: 🚀 Build and Publish .exe
        working-directory: ./frontend
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }} # Pakai token PAT baru yang kita buat untuk akses lintas-repository
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }} # Paksa override GITHUB_TOKEN bawaan GitHub Actions
        run: npm run dist:publish
