name: Build and Release Mamet AI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/package.json' # Berkas berubah ≠ versi naik — yang memutuskan adalah job periksa-versi di bawah
  workflow_dispatch: # Memungkinkan Anda menekan tombol "Run workflow" secara manual di GitHub

jobs:
  # 2026-10-28 (T20): `paths` hanya tahu BERKAS mana yang berubah, bukan baris mana. Push yang mengganti versi Electron
  # di package.json (versi aplikasi tetap 4.3.2) memicu build rilis yang akan menerbitkan isi lain bernomor sama ke
  # rilis yang sudah terbit — dibatalkan tangan. Pembaruan otomatis hanya bergerak bila versi NAIK (latest.yml), jadi
  # build tanpa kenaikan versi tak berguna bagi pengguna dan berisiko menimpa rilis. Jalankan manual tetap selalu build.
  periksa-versi:
    runs-on: ubuntu-latest
    outputs:
      naik: ${{ steps.banding.outputs.naik }}
    steps:
      - uses: actions/checkout@v4
      - name: 🔢 Versi aplikasi berubah?
        id: banding
        env:
          SEBELUM: ${{ github.event.before }}
          PEMICU: ${{ github.event_name }}
        run: |
          baru=$(node -p "require('./frontend/package.json').version")
          if [ "$PEMICU" != "push" ] || [ -z "$SEBELUM" ] || [ "$SEBELUM" = "0000000000000000000000000000000000000000" ]; then
            echo "pemicu $PEMICU — build tanpa pemeriksaan versi ($baru)"; echo "naik=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Tak bisa dipastikan → MERAH & berhenti (tanpa build), bukan diam-diam dianggap naik: itu celah yang ditutup di sini.
          # Bila memang perlu rilis, jalankan manual (Run workflow).
          lama=$( (git fetch --quiet --depth=1 origin "$SEBELUM" && git show "$SEBELUM:frontend/package.json") 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{}})")
          if [ -z "$lama" ]; then
            echo "::error::Versi sebelum push ($SEBELUM) tak bisa dibaca — build tidak dijalankan. Jalankan manual bila memang perlu rilis."
            exit 1
          fi
          if [ "$lama" = "$baru" ]; then
            echo "::notice::Versi tidak berubah ($baru) — tidak ada build & tidak ada rilis. Naikkan versi di frontend/package.json untuk merilis."
            echo "naik=false" >> "$GITHUB_OUTPUT"
          else
            echo "versi $lama -> $baru — build & rilis"; echo "naik=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: periksa-versi
    if: needs.periksa-versi.outputs.naik == 'true'
    runs-on: windows-latest # Kita gunakan environment Windows karena Anda nge-build .exe

    permissions:
      contents: write # Wajib agar robot GitHub diizinkan membuat Release baru

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Node 24 (2026-10-27): Node 20 sudah habis dukungan dan TIDAK akan menerima tambalan CVE-2026-111497 (Brotli,
      # "Black October"); 24 juga versi laptop Owner. check-latest: tanpanya setup-node boleh memakai Node 24 yang
      # tersimpan di runner — bisa lebih tua dari 24.22.1 yang tertambal.
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./frontend
        run: npm ci

      # Item 129 (rilis 4.3.0): pemasang membawa Python + Ecosystem Crawler (npm run crawler:siapkan menyalinnya dari
      # .venv crawler). .venv tidak di-commit (repo publik), jadi dibangun di sini dari daftar TERKUNCI — versi Python dan
      # 86 paket persis sama dengan .venv yang sudah diuji di laptop Owner (--no-deps: tak ada paket yang diselesaikan ulang).
      # --require-hashes (T20, 2026-10-28): berkas yang isinya beda dari hash di daftar ditolak — versi palsu/tertukar
      # di indeks tidak bisa lolos walau nomor versinya sama. Daftar ditulis scripts/kunci_bundel.py, bukan tangan.
      - name: 🐍 Setup Python (crawler terbundel)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: 🕷️ Siapkan .venv crawler dari daftar terkunci
        working-directory: ./capability/ecosystem-crawler
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --no-deps --require-hashes --disable-pip-version-check --no-input -r requirements-bundel.txt

      - name: ⚙️ Inject Environment Variables
        working-directory: ./frontend
        run: |
          echo "VITE_SUPABASE_URL=https://uuyzdjifhdfyyvpxsofu.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1eXpkamlmaGRmeXl2cHhzb2Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjMyODUsImV4cCI6MjA5NTIzOTI4NX0.atDqwfpg_uwFI0nZuKQNxebCYh1KC7tdkSooC52m4YQ" >> .env

      - name: 🚀 Build and Publish .exe
        working-directory: ./frontend
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }} # Pakai token PAT baru yang kita buat untuk akses lintas-repository
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }} # Paksa override GITHUB_TOKEN bawaan GitHub Actions
        run: npm run dist:publish
